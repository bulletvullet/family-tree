<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо</title>
<style>
  :root {
    --bg: #13151d;
    --ink: #e7e9f2;
    --ink-soft: #969eb4;
    --line: #2d3244;
    --accent: #7b8cf0;
    --accent-dark: #95a3f5;
    --accent-soft: rgba(123, 140, 240, .16);
    --spouse: #b98ac4;
    --focus-green: #3f8f4f;
    --sunk: #232735;
    --sunk-hi: #262b3b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(90, 103, 216, .16) 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(52, 160, 130, .1) 0%, transparent 55%),
      var(--bg);
    color-scheme: dark;
    overflow: hidden;
  }
  .stage { display: flex; flex-direction: column; height: 100vh; padding: 14px 16px; }
  .tree-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .tree-toolbar h2 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .tree-controls { display: flex; gap: 8px; }
  .btn-tool {
    width: 34px; height: 34px;
    padding: 0;
    font: inherit;
    font-size: 17px;
    color: var(--ink);
    background: #232735;
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
  }
  .btn-tool:hover { background: var(--accent-soft); border-color: var(--accent); }
  /* language switch: wider than the square tool buttons, it holds a code like EN */
  .btn-lang {
    width: auto;
    min-width: 40px;
    padding: 0 9px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .4px;
  }
  .tree-viewport { position: relative; flex: 1; min-height: 0; }
  #tree3d { position: absolute; inset: 0; }
  .tree-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
  }
  /* classic chart */
  .tree-chart { position: absolute; inset: 0; }
  .chart-svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .chart-svg.is-dragging { cursor: grabbing; }
  .chart-wires path { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linecap: square; }
  .chart-bar { fill: none; stroke: var(--spouse); stroke-width: 2.2; }
  .chart-bar.ex { stroke: var(--line); stroke-dasharray: 5 4; }
  .chart-node { cursor: pointer; }
  .chart-box {
    fill: var(--sunk);
    stroke: var(--line);
    stroke-width: 1.4;
    transition: fill .12s, stroke .12s;
  }
  .chart-node:hover .chart-box { fill: var(--sunk-hi); stroke: var(--accent); }
  .chart-node.is-selected .chart-box { stroke: var(--accent); stroke-width: 2.4; }
  .chart-node.is-focus .chart-box { stroke: var(--focus-green); stroke-width: 2.6; }
  .chart-node.is-dead .chart-box { stroke-dasharray: 4 3; }
  .chart-name { fill: var(--ink); font-size: 12.5px; font-weight: 600; text-anchor: middle; pointer-events: none; }
  .chart-given { fill: var(--ink); font-size: 11.5px; text-anchor: middle; pointer-events: none; }
  .chart-dates { fill: var(--ink-soft); font-size: 10.5px; text-anchor: middle; pointer-events: none; }
  .chart-node.is-dead .chart-name,
  .chart-node.is-dead .chart-given { fill: var(--ink-soft); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="tree-toolbar">
    <h2 data-i18n="app.title">Семейное древо</h2>
    <div class="tree-controls">
      <button id="viewToggle" class="btn-tool btn-lang" title="Разложить по поколениям">Древо</button>
      <button id="langToggle" class="btn-tool btn-lang" data-i18n-title="app.langNext" title="Switch to English">EN</button>
      <button id="zoomOut" class="btn-tool" data-i18n-title="tree.zoomOut" title="Отдалить">−</button>
      <button id="zoomIn" class="btn-tool" data-i18n-title="tree.zoomIn" title="Приблизить">+</button>
      <button id="fitView" class="btn-tool" data-i18n-title="tree.fit" title="Вписать">⤢</button>
    </div>
  </div>
  <div class="tree-viewport" id="treeViewport">
    <div id="tree3d"></div>
    <div id="treeChart" class="tree-chart hidden"></div>
    <div id="treeEmpty" class="tree-empty hidden" data-i18n="tree.noData">Нет данных</div>
  </div>
</div>
<script src="graph-bundle.js"></script>
<script src="i18n.js?v=5"></script>
<script src="chart.js?v=11"></script>
<script src="tree.js?v=12"></script>
</body>
</html>
