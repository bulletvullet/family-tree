<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейное древо</title>
<style>
  :root {
    --bg: #13151d;
    --ink: #e7e9f2;
    --ink-soft: #969eb4;
    --line: #2d3244;
    --accent: #7b8cf0;
    --accent-dark: #95a3f5;
    --accent-soft: rgba(123, 140, 240, .16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(90, 103, 216, .16) 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(52, 160, 130, .1) 0%, transparent 55%),
      var(--bg);
    color-scheme: dark;
    overflow: hidden;
  }
  .stage { display: flex; flex-direction: column; height: 100vh; padding: 14px 16px; }
  .tree-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .tree-toolbar h2 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .tree-controls { display: flex; gap: 8px; }
  .btn-tool {
    width: 34px; height: 34px;
    padding: 0;
    font: inherit;
    font-size: 17px;
    color: var(--ink);
    background: #232735;
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
  }
  .btn-tool:hover { background: var(--accent-soft); border-color: var(--accent); }
  .tree-viewport { position: relative; flex: 1; min-height: 0; }
  #tree3d { position: absolute; inset: 0; }
  .tree-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="tree-toolbar">
    <h2>Семейное древо</h2>
    <div class="tree-controls">
      <button id="zoomOut" class="btn-tool" title="Отдалить">−</button>
      <button id="zoomIn" class="btn-tool" title="Приблизить">+</button>
      <button id="fitView" class="btn-tool" title="Вписать">⤢</button>
    </div>
  </div>
  <div class="tree-viewport" id="treeViewport">
    <div id="tree3d"></div>
    <div id="treeEmpty" class="tree-empty hidden">Нет данных</div>
  </div>
</div>
<script src="graph-bundle.js"></script>
<script src="tree.js"></script>
</body>
</html>
